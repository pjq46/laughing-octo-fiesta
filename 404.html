:root{--text:#f2f4f8;--text-dim:#9aa5b5;--accent:#7aa2ff;--panel-border:#2a3242;--font-pixel:"FusionPixel","Zpix","Courier New",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070c;color:var(--text);font-family:var(--font-pixel);-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#101827 55%,#141b2e 100%)}
.wrap{width:min(82vw,360px);text-align:center;padding:0 8px}
.logo{font-size:clamp(30px,9vw,42px);font-weight:800;letter-spacing:.12em;text-shadow:0 4px 24px rgba(122,162,255,.35)}
.sub{margin-top:12px;font-size:clamp(12px,3.4vw,15px);color:var(--text-dim);letter-spacing:.3em}
.bar{margin-top:clamp(34px,9vw,54px);height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#5f8bff,#9bb7ff);transition:width .25s ease}
.meta{margin-top:14px;font-size:12px;letter-spacing:.18em;color:var(--text-dim)}
.meta .pct{color:var(--accent)}
.tip{margin-top:8px;font-size:11px;letter-spacing:.1em;color:#5b6675;min-height:16px}
.err{margin-top:22px;font-size:12px;line-height:1.8;color:#ff9b9b;display:none}
.retry{margin-top:14px;display:none;padding:10px 26px;font-family:inherit;font-size:13px;letter-spacing:.2em;color:#05070c;background:var(--accent);border:0;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">唐熙九九</div>
  <div class="sub">913 校园小剧场</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="meta"><span id="pct">0%</span> · <span id="size">0.0 / 6.3 MB</span></div>
  <div class="tip" id="tip">正在连接加速线路…</div>
  <div class="err" id="err"></div>
  <button class="retry" id="retry">重试</button>
</div>
<script>
(function(){
  var CDN = "https://gcore.jsdelivr.net/gh/pjq46/laughing-octo-fiesta@main/game.html";
  var LOCAL = "./game.html";
  var TOTAL_HINT = 6570211;
  var fill = document.getElementById('fill');
  var pctEl = document.getElementById('pct');
  var sizeEl = document.getElementById('size');
  var tip = document.getElementById('tip');
  var errEl = document.getElementById('err');
  var retry = document.getElementById('retry');
  var forceLocal = /(^|[?&])src=local/.test(location.search);

  function mb(n){ return (n/1048576).toFixed(1); }
  function paint(rec, total){
    var t = total || TOTAL_HINT;
    var p = Math.max(0, Math.min(100, Math.round(rec / t * 100)));
    fill.style.width = p + '%';
    pctEl.textContent = p + '%';
    sizeEl.textContent = mb(rec) + ' / ' + mb(t) + ' MB';
  }

  function grab(url, onProgress){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort('timeout'); }, 15000);
    return fetch(url, { cache: 'no-store', signal: ctrl.signal }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var total = parseInt(res.headers.get('content-length') || '0', 10) || TOTAL_HINT;
      if (!res.body || !res.body.getReader) {
        return res.text();
      }
      var reader = res.body.getReader();
      var chunks = [], received = 0;
      function pump(){
        return reader.read().then(function(r){
          if (r.done) { clearTimeout(timer); return new Blob(chunks).text(); }
          chunks.push(r.value); received += r.value.length;
          onProgress(received, total);
          if (received > 400000) clearTimeout(timer), timer = setTimeout(function(){ ctrl.abort('timeout'); }, 20000);
          return pump();
        });
      }
      return pump();
    });
  }

  function render(html){
    fill.style.width = '100%'; pctEl.textContent = '100%'; tip.textContent = '正在进入…';
    document.open(); document.write(html); document.close();
  }

  function fail(msg){
    errEl.style.display = 'block';
    errEl.textContent = '载入失败：' + msg + '。请检查网络后重试。';
    retry.style.display = 'inline-block';
    tip.textContent = '';
  }

  function run(){
    errEl.style.display = 'none'; retry.style.display = 'none';
    tip.textContent = '正在连接加速线路…';
    var chain = forceLocal ? [LOCAL] : [CDN, LOCAL];
    var i = 0;
    function next(){
      if (i >= chain.length) { fail('两条线路都不可用'); return; }
      var url = chain[i++];
      if (url === LOCAL) tip.textContent = '加速线路不可用，切换备用线路…';
      grab(url, paint).then(render).catch(function(e){
        next();
      });
    }
    next();
  }

  retry.onclick = run;
  run();
})();
</script>
</body>
</html>
